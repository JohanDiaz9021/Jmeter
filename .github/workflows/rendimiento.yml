name: Pruebas de rendimiento

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rendimiento:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el repositorio en la máquina de GitHub
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # 2. JMeter 5.6.3 necesita Java
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Instala JMeter y lo deja en el PATH para los pasos siguientes
      - name: Instalar JMeter 5.6.3
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz -C $HOME
          echo "$HOME/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      # 4. Levanta la API en el puerto 8080, en segundo plano
      - name: Levantar la API
        run: nohup python3 api/ticketmania_simple.py > api.log 2>&1 &

      # 5. Espera a que /api/salud responda antes de lanzar JMeter
      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/salud; then exit 0; fi
            sleep 1
          done
          echo "La API no respondió a tiempo"
          exit 1

      # 6. Ejecuta el plan en modo no-GUI desde su carpeta (para que encuentre datos.csv)
      - name: Ejecutar el plan de JMeter
        working-directory: pruebas/jmeter
        run: jmeter -n -t Ticketmania.jmx -l resultados.jtl -e -o reporte

      # 7. JMeter no marca el job en rojo por sí solo: revisa la columna success del .jtl
      - name: Revisar peticiones fallidas
        working-directory: pruebas/jmeter
        run: |
          FALLIDAS=$(awk -F, 'NR>1 && $8 != "true"' resultados.jtl | wc -l)
          echo "Peticiones fallidas: $FALLIDAS"
          if [ "$FALLIDAS" -gt 0 ]; then exit 1; fi

      # 8. Sube el reporte aunque el paso anterior haya fallado
      - name: Subir el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jmeter
          path: pruebas/jmeter/reporte
